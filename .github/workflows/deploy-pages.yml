name: Deploy The Inch Park Vault

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore image assets
        run: |
          if [ ! -f public/escc-logo.png ]; then
            base64 --decode .github/pages-assets/escc-logo.png.b64 > public/escc-logo.png
          fi
          if [ ! -f public/og-vault.png ]; then
            curl --fail --location --output public/og-vault.png https://edinburgh-south-club-records.djksaunders.chatgpt.site/og-vault.png
          fi
          if [ ! -f public/og.png ]; then
            curl --fail --location --output public/og.png https://edinburgh-south-club-records.djksaunders.chatgpt.site/og.png
          fi
          touch public/.nojekyll

      - name: Build static site
        run: pnpm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
